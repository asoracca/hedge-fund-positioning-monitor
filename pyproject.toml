[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hedge-fund-crowding-monitor"
version = "0.1.0"
description = "Point-in-time institutional holdings and crowding research terminal"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["pandas>=2.2,<2.3", "numpy>=1.26,<2.1", "scipy>=1.13,<1.14", "scikit-learn>=1.5,<1.7", "duckdb>=1.1,<2", "pyarrow>=18,<22", "streamlit>=1.40,<1.51", "plotly>=5.24,<7", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6"]

[project.scripts]
crowding = "crowding.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
